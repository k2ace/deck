<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proposta K2ACE · Desafio das Concessionárias 2026</title>
<meta name="description" content="Credenciamento com QR, leitura nos estandes, registro de vendas e painel ao vivo para o Desafio das Concessionárias, 16 a 18 de outubro de 2026.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@font-face { font-family:'Mont'; src:url('img/Mont-Bold.otf') format('opentype'); font-weight:700 900; font-display:block; }

:root {
  --bg:#0a0a0a; --bg-2:#111; --bg-3:#1a1a1a; --bg-4:#222;
  --ink:#fff; --ink-2:#c9c9c9; --ink-3:#8a8a8a;
  --line:#2a2a2a; --line-soft:rgba(255,255,255,.06);
  --y:#f3ff00; --y-2:#ffee00; --y-3:#d9e600;
  --y-soft:rgba(243,255,0,.08); --y-line:rgba(243,255,0,.28);
  --glass:rgba(10,10,10,.62);
  --display:'Mont','Inter',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --pad:clamp(1rem,5vw,3.75rem);
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
body { background:var(--bg); color:var(--ink); font:400 1rem/1.6 var(--body); overflow-x:hidden; -webkit-font-smoothing:antialiased; }
img { display:block; max-width:100%; }

/* fundo grid metálico do site do feirão */
.grid-bg { position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(243,255,0,.07), transparent 60%),
    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px) 0 0/40px 40px,
    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px) 0 0/40px 40px,
    var(--bg); }
main, nav, footer { position:relative; z-index:1; }

/* NAV translúcida */
nav { position:fixed; top:0; left:0; right:0; z-index:50; height:3.75rem;
  display:flex; align-items:center; justify-content:space-between; padding:0 var(--pad);
  background:var(--glass); backdrop-filter:blur(18px) saturate(160%); -webkit-backdrop-filter:blur(18px) saturate(160%);
  border-bottom:1px solid var(--line-soft); }
.brand { font-family:var(--display); font-weight:900; font-size:.95rem; letter-spacing:.06em; }
.brand b { color:var(--y); }
.nav-r { font-size:.68rem; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-3); }

/* utilitários */
section { padding:clamp(4.5rem,10vw,7rem) var(--pad); }
.wrap { max-width:70rem; margin:0 auto; }
.tag { display:inline-flex; align-items:center; gap:.6rem; font-family:var(--display); font-size:.7rem; letter-spacing:.18em; text-transform:uppercase; color:var(--y); margin-bottom:1rem; }
.tag::before { content:''; width:1.6rem; height:2px; background:var(--y); box-shadow:0 0 10px var(--y); }
h2 { font-family:var(--display); font-weight:900; font-size:clamp(1.9rem,4.6vw,3.4rem); line-height:1.04; letter-spacing:-.02em; text-transform:uppercase; }
h2 em { font-style:normal; color:var(--y); text-shadow:0 0 22px rgba(243,255,0,.4); }
.lead { font-size:clamp(.98rem,1.4vw,1.08rem); color:var(--ink-2); line-height:1.8; max-width:44rem; margin-top:1.25rem; }
.lead strong { color:var(--ink); font-weight:600; }

/* HERO */
#hero { min-height:100vh; min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  padding:6rem var(--pad) 4rem; position:relative; overflow:hidden;
  background:
    linear-gradient(180deg, rgba(0,0,0,.6), rgba(0,0,0,.68) 45%, rgba(10,10,10,1) 100%),
    image-set(url('img/bgfeirao.webp') type('image/webp'), url('img/bgfeirao.jpg') type('image/jpeg')) center/cover no-repeat; }
.pill { display:inline-flex; align-items:center; gap:.6rem; padding:.5rem 1rem; border:1px solid var(--y-line); border-radius:99px; background:rgba(243,255,0,.05);
  font-family:var(--display); font-size:.68rem; letter-spacing:.16em; text-transform:uppercase; color:var(--y); }
.pill i { width:.5rem; height:.5rem; border-radius:50%; background:var(--y); box-shadow:0 0 12px var(--y); }
.logo-wrap { position:relative; margin:1.6rem 0 1.2rem; }
.logo-wrap::before { content:''; position:absolute; inset:-2.5rem; background:radial-gradient(closest-side, rgba(243,255,0,.22), transparent 70%); filter:blur(10px); }
.logo-wrap img { position:relative; width:min(30rem,82vw); height:auto; filter:drop-shadow(0 10px 30px rgba(0,0,0,.8)); }
#hero h1 { font-family:var(--display); font-weight:900; font-size:clamp(1.7rem,5vw,3.6rem); line-height:1.04; letter-spacing:-.02em; max-width:56rem; }
#hero h1 .neon { color:var(--y); text-shadow:0 0 20px rgba(243,255,0,.55), 0 0 50px rgba(243,255,0,.22); }
#hero .sub { max-width:40rem; margin:1.2rem auto 0; color:var(--ink-2); font-size:clamp(.95rem,1.5vw,1.1rem); line-height:1.75; }
.hero-stats { margin-top:2.2rem; display:inline-grid; grid-template-columns:repeat(3,auto); border:1px solid var(--line); border-radius:1rem; background:rgba(0,0,0,.5);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
.hs { padding:1rem 1.5rem; text-align:center; }
.hs + .hs { border-left:1px solid var(--line); }
.hs .n { font-family:var(--display); font-weight:900; font-size:1.9rem; line-height:1; color:var(--y); }
.hs .u { font-size:.66rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); margin-top:.35rem; font-weight:600; }

/* O QUE OUVIMOS */
.dor-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:1rem; overflow:hidden; margin-top:3rem; }
.dor { background:var(--bg-2); padding:1.8rem 1.5rem; }
.dor .q { font-family:var(--display); font-weight:900; font-size:2.2rem; color:var(--y); line-height:.8; }
.dor h3 { font-size:1rem; font-weight:600; margin:.8rem 0 .5rem; line-height:1.35; }
.dor p { font-size:.85rem; color:var(--ink-3); line-height:1.65; }

/* JORNADA */
#jornada { background:linear-gradient(180deg, transparent, rgba(17,17,17,.9) 15%, rgba(17,17,17,.9) 85%, transparent); }
.steps { display:grid; grid-template-columns:repeat(4,1fr); gap:1rem; margin-top:3rem; counter-reset:s; }
.step { position:relative; background:var(--bg-3); border:1px solid var(--line); border-radius:1rem; padding:1.6rem 1.4rem 1.5rem; }
.step::after { content:''; position:absolute; top:2.3rem; right:-1rem; width:1rem; height:2px; background:var(--y-line); }
.step:last-child::after { display:none; }
.step .sn { display:inline-flex; align-items:center; justify-content:center; width:2.4rem; height:2.4rem; border-radius:.6rem; background:var(--y); color:#0a0a0a;
  font-family:var(--display); font-weight:900; font-size:1.05rem; box-shadow:0 0 18px rgba(243,255,0,.35); }
.step .sw { font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); margin:1rem 0 .25rem; font-weight:600; }
.step h3 { font-family:var(--display); font-weight:900; font-size:1.15rem; text-transform:uppercase; letter-spacing:-.01em; line-height:1.1; }
.step ul { list-style:none; margin-top:.9rem; }
.step li { font-size:.84rem; color:var(--ink-2); line-height:1.5; padding:.45rem 0 .45rem 1rem; position:relative; border-top:1px solid var(--line-soft); }
.step li::before { content:''; position:absolute; left:0; top:.95rem; width:.35rem; height:.35rem; border-radius:50%; background:var(--y); }
.opt { margin-top:1.4rem; font-size:.85rem; color:var(--ink-3); line-height:1.7; max-width:48rem; }
.opt b { color:var(--ink-2); font-weight:600; }

/* TELAS */
.telas { display:grid; grid-template-columns:.8fr 1.2fr; gap:2rem; margin-top:3rem; align-items:start; }
.phone { width:100%; max-width:19rem; margin:0 auto; background:#050505; border:1px solid #333; border-radius:2.4rem; padding:.7rem; box-shadow:0 30px 70px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.04); }
.screen { background:var(--bg-2); border-radius:1.8rem; overflow:hidden; }
.scr-top { padding:1.1rem 1.1rem .8rem; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); }
.scr-top .st { font-family:var(--display); font-weight:900; font-size:.85rem; }
.scr-top .sl { font-size:.6rem; letter-spacing:.1em; text-transform:uppercase; color:var(--y); border:1px solid var(--y-line); padding:.2rem .5rem; border-radius:99px; }
.cam { margin:1rem; aspect-ratio:1; border-radius:1rem; background:radial-gradient(circle at 50% 50%, #1d1d1d, #0d0d0d); position:relative; display:grid; place-items:center; }
.cam::before, .cam::after { content:''; position:absolute; inset:14%; border:2px solid var(--y); border-radius:.8rem; clip-path:polygon(0 0,22% 0,22% 4%,4% 4%,4% 22%,0 22%,0 78%,4% 78%,4% 96%,22% 96%,22% 100%,78% 100%,78% 96%,96% 96%,96% 78%,100% 78%,100% 22%,96% 22%,96% 4%,78% 4%,78% 0,100% 0,100% 100%,0 100%); }
.cam::after { display:none; }
.qr { width:46%; aspect-ratio:1; background:
  conic-gradient(from 90deg at 30% 30%, #fff 25%, transparent 0) 0 0/22% 22%,
  repeating-linear-gradient(90deg, #fff 0 8%, transparent 8% 14%), #0d0d0d; opacity:.85; border-radius:.3rem;
  -webkit-mask:repeating-linear-gradient(0deg,#000 0 9%,transparent 9% 13%); mask:repeating-linear-gradient(0deg,#000 0 9%,transparent 9% 13%); }
.found { margin:0 1rem 1rem; background:var(--bg-3); border:1px solid var(--y-line); border-radius:1rem; padding:.9rem 1rem; }
.found .fn { font-weight:600; font-size:.92rem; }
.found .fd { font-size:.72rem; color:var(--ink-3); margin-top:.15rem; line-height:1.5; }
.found .chips { display:flex; gap:.35rem; flex-wrap:wrap; margin-top:.6rem; }
.chip { font-size:.62rem; padding:.2rem .5rem; border-radius:99px; background:var(--bg-4); color:var(--ink-2); }
.chip.y { background:var(--y-soft); color:var(--y); border:1px solid var(--y-line); }
.scr-btns { display:grid; grid-template-columns:1fr 1fr; gap:.5rem; padding:0 1rem 1.2rem; }
.sb { text-align:center; font-size:.72rem; font-weight:600; padding:.7rem; border-radius:.7rem; background:var(--bg-4); color:var(--ink-2); }
.sb.y { background:var(--y); color:#0a0a0a; }
.cap { text-align:center; font-size:.78rem; color:var(--ink-3); margin-top:1rem; }

.dash { background:linear-gradient(180deg,var(--bg-3),var(--bg-2)); border:1px solid var(--line); border-radius:1.2rem; overflow:hidden; box-shadow:0 30px 70px rgba(0,0,0,.5); }
.dh { display:flex; justify-content:space-between; align-items:center; padding:1rem 1.3rem; border-bottom:1px solid var(--line); gap:1rem; }
.dh .dt { font-family:var(--display); font-weight:900; font-size:.95rem; text-transform:uppercase; }
.live { font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--y); display:flex; align-items:center; gap:.45rem; white-space:nowrap; }
.live::before { content:''; width:.45rem; height:.45rem; border-radius:50%; background:var(--y); box-shadow:0 0 8px var(--y); }
.kpis { display:grid; grid-template-columns:repeat(4,1fr); border-bottom:1px solid var(--line); }
.kpi { padding:1rem 1.1rem; }
.kpi + .kpi { border-left:1px solid var(--line); }
.kpi .kv { font-family:var(--display); font-weight:900; font-size:1.55rem; line-height:1; }
.kpi .kv.y { color:var(--y); }
.kpi .kl { font-size:.62rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); margin-top:.35rem; line-height:1.35; }
.dgrid { display:grid; grid-template-columns:1fr 1fr; }
.dbox { padding:1.1rem 1.3rem 1.3rem; }
.dbox + .dbox { border-left:1px solid var(--line); }
.dbox h4 { font-size:.68rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-weight:600; margin-bottom:.9rem; }
.porta { display:grid; grid-template-columns:3.6rem 1fr 2.6rem; align-items:center; gap:.6rem; margin-bottom:.65rem; font-size:.78rem; }
.porta .pl { color:var(--ink-2); }
.bar { height:.55rem; background:var(--bg-4); border-radius:99px; overflow:hidden; }
.bar i { display:block; height:100%; border-radius:99px; background:var(--ink-3); transform-origin:left; }
.bar i.y { background:var(--y); box-shadow:0 0 10px rgba(243,255,0,.5); }
.porta .pv { text-align:right; font-weight:600; font-variant-numeric:tabular-nums; }
.alert { margin-top:.9rem; font-size:.72rem; color:var(--y); background:var(--y-soft); border:1px solid var(--y-line); border-radius:.6rem; padding:.55rem .7rem; line-height:1.45; }
.hrs { display:flex; align-items:flex-end; gap:.3rem; height:6.5rem; }
.hrs div { flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:2px; height:100%; }
.hrs b { display:block; background:var(--ink-3); border-radius:3px 3px 0 0; opacity:.55; }
.hrs b.v { background:var(--y); opacity:1; border-radius:0; }
.hrl { display:flex; justify-content:space-between; font-size:.6rem; color:var(--ink-3); margin-top:.4rem; }
.leg { display:flex; gap:1rem; font-size:.64rem; color:var(--ink-3); margin-top:.6rem; }
.leg span::before { content:''; display:inline-block; width:.55rem; height:.55rem; border-radius:2px; margin-right:.35rem; vertical-align:-1px; background:var(--ink-3); opacity:.55; }
.leg span.v::before { background:var(--y); opacity:1; }
.race { border-top:1px solid var(--line); padding:1.1rem 1.3rem 1.3rem; }
.race h4 { font-size:.68rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-weight:600; margin-bottom:.8rem; }
.lane { display:grid; grid-template-columns:6.5rem 1fr 4.5rem; align-items:center; gap:.7rem; font-size:.78rem; margin-bottom:.5rem; }
.lane .ln { color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lane .lt { position:relative; height:1.3rem; border-bottom:1px dashed var(--line); }
.lane .car { position:absolute; top:50%; transform:translate(-100%,-50%); width:1.6rem; height:.7rem; border-radius:.35rem .6rem .6rem .35rem; background:var(--y); box-shadow:0 0 12px rgba(243,255,0,.6); }
.lane + .lane .car { background:var(--ink-2); box-shadow:none; }
.lane .lv { text-align:right; font-variant-numeric:tabular-nums; color:var(--ink-3); font-size:.72rem; }
.lane .lv b { color:var(--ink); font-weight:600; }
.dnote { font-size:.75rem; color:var(--ink-3); margin-top:1rem; font-style:italic; }

/* ENTREGA (painel + relatório) */
.ent-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-top:3rem; }
.ent { background:var(--bg-2); border:1px solid var(--line); border-radius:1rem; padding:1.8rem 1.6rem; }
.ent .et { font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; color:var(--y); font-weight:600; }
.ent h3 { font-family:var(--display); font-weight:900; font-size:1.35rem; text-transform:uppercase; margin:.4rem 0 1rem; line-height:1.1; }
.ent ul { list-style:none; }
.ent li { font-size:.9rem; color:var(--ink-2); padding:.6rem 0 .6rem 1.6rem; position:relative; border-top:1px solid var(--line-soft); line-height:1.5; }
.ent li::before { content:'✓'; position:absolute; left:0; top:.6rem; color:var(--y); font-weight:700; }
.dono { margin-top:1rem; display:flex; gap:1rem; align-items:center; background:var(--y-soft); border:1px solid var(--y-line); border-radius:1rem; padding:1.1rem 1.4rem; }
.dono .di { font-family:var(--display); font-weight:900; font-size:1.6rem; color:var(--y); }
.dono p { font-size:.9rem; color:var(--ink-2); line-height:1.6; }
.dono p b { color:var(--ink); }

/* ESCOPO */
#escopo { background:linear-gradient(180deg, transparent, rgba(17,17,17,.9) 15%, rgba(17,17,17,.9) 85%, transparent); }
.esc-grid { display:grid; grid-template-columns:1.25fr .75fr; gap:1rem; margin-top:3rem; }
.esc { border-radius:1rem; padding:1.8rem 1.6rem; border:1px solid var(--line); background:var(--bg-3); }
.esc.in { border-color:var(--y-line); }
.esc h3 { font-family:var(--display); font-weight:900; font-size:1.05rem; text-transform:uppercase; margin-bottom:1rem; }
.esc.in h3 { color:var(--y); }
.esc ul { list-style:none; columns:2; column-gap:1.5rem; }
.esc.out ul { columns:1; }
.esc li { break-inside:avoid; font-size:.88rem; color:var(--ink-2); padding:.5rem 0 .5rem 1.4rem; position:relative; line-height:1.45; }
.esc.in li::before { content:'✓'; position:absolute; left:0; color:var(--y); font-weight:700; }
.esc.out li { color:var(--ink-3); }
.esc.out li::before { content:'×'; position:absolute; left:.1rem; color:var(--ink-3); }
.esc .en { font-size:.78rem; color:var(--ink-3); margin-top:1rem; line-height:1.6; }

.esc3 { list-style:none; columns:3; column-gap:1.5rem; }
@media (max-width:960px){ .esc3 { columns:2; } }
@media (max-width:620px){ .esc3 { columns:1; } }
/* PROVA */
.prova { display:grid; grid-template-columns:1.1fr .9fr; gap:3rem; align-items:center; }
.prova-nums { margin-top:3rem; display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:1rem; overflow:hidden; }
.pn { background:var(--bg-2); padding:1.6rem 1.4rem; }
.pn .pv { font-family:var(--display); font-weight:900; font-size:2.2rem; line-height:1; color:var(--y); }
.pn .pl { font-size:.8rem; color:var(--ink-3); margin-top:.5rem; line-height:1.5; }

@media (max-width:620px){ .prova-nums { grid-template-columns:1fr 1fr; } }
/* CRONOGRAMA */
.tl { margin-top:3rem; display:grid; grid-template-columns:repeat(5,1fr); border:1px solid var(--line); border-radius:1rem; overflow:hidden; }
.tli { padding:1.4rem 1.1rem; border-right:1px solid var(--line); background:var(--bg-2); }
.tli:last-child { border-right:none; }
.tli.hot { background:linear-gradient(180deg, rgba(243,255,0,.1), var(--bg-2)); }
.tli .td { font-family:var(--display); font-weight:900; font-size:1.1rem; color:var(--y); line-height:1.1; }
.tli .tw { font-size:.62rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); margin-top:.3rem; font-weight:600; }
.tli h4 { font-size:.88rem; font-weight:600; margin:.8rem 0 .35rem; line-height:1.3; }
.tli p { font-size:.78rem; color:var(--ink-3); line-height:1.55; }
.prazo { margin-top:1rem; font-size:.88rem; color:var(--ink-2); line-height:1.6; }
.prazo b { color:var(--y); }

/* INVESTIMENTO */
.inv { display:grid; grid-template-columns:1fr 1fr; gap:3rem; align-items:center; margin-top:3rem; }
.inv-side p { font-size:.95rem; color:var(--ink-2); line-height:1.8; }
.inv-side .per { margin-top:1.4rem; display:flex; justify-content:space-between; align-items:center; gap:1rem; padding:1.1rem 1.3rem; border:1px solid var(--line); border-radius:1rem; background:var(--bg-2); }
.inv-side .per .k { font-size:.82rem; color:var(--ink-3); line-height:1.5; }
.inv-side .per .v { font-family:var(--display); font-weight:900; font-size:1.3rem; color:var(--y); white-space:nowrap; }
.pack { position:relative; background:linear-gradient(180deg,var(--bg-4),var(--bg-2)); border:1px solid var(--y); border-radius:1.3rem; padding:2.6rem 2.2rem 2.2rem;
  box-shadow:0 0 0 1px rgba(243,255,0,.15), 0 30px 80px rgba(0,0,0,.6), 0 0 60px rgba(243,255,0,.08); }
.pack .badge { position:absolute; top:-.8rem; left:2.2rem; background:var(--y); color:#0a0a0a; font-family:var(--display); font-weight:900; font-size:.66rem; letter-spacing:.12em; text-transform:uppercase; padding:.4rem .85rem; border-radius:.4rem; }
.pack h3 { font-family:var(--display); font-weight:900; font-size:1.25rem; text-transform:uppercase; }
.pack .ps { font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); margin-top:.3rem; }
.price { display:flex; align-items:flex-end; gap:.5rem; margin-top:1.6rem; }
.price .num { font-family:var(--display); font-weight:900; font-size:clamp(3rem,7vw,4.2rem); line-height:.85; letter-spacing:-.03em; color:var(--y); text-shadow:0 0 30px rgba(243,255,0,.35); }
.price .pu { font-size:.85rem; color:var(--ink-3); padding-bottom:.35rem; }
.pay { margin-top:1.2rem; display:grid; grid-template-columns:1fr 1fr; gap:.5rem; }
.pay > div { background:var(--bg-3); border:1px solid var(--line); border-radius:.7rem; padding:.7rem .8rem; }
.pay .pk { font-size:.62rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); }
.pay .pv { font-weight:600; font-size:.95rem; margin-top:.15rem; }
.pack ul { list-style:none; margin-top:1.4rem; }
.pack li { font-size:.86rem; color:var(--ink-2); padding:.55rem 0; display:flex; gap:.6rem; border-top:1px solid var(--line-soft); line-height:1.45; }
.pack li span { color:var(--y); font-weight:700; }
.inv-note { font-size:.8rem; color:var(--ink-3); margin-top:1.5rem; line-height:1.7; max-width:46rem; }

.inv2 { display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; margin-top:3.2rem; align-items:start; }
.pack.alt { border-color:var(--line); box-shadow:0 30px 80px rgba(0,0,0,.5); }
.pack.alt .badge { background:var(--bg-4); color:var(--y); border:1px solid var(--y-line); }
.pack.alt .price .num { color:var(--ink); text-shadow:none; }
@media (max-width:960px){ .inv2 { grid-template-columns:1fr; gap:2.2rem; } }

/* PRECISAMOS */
.need { display:grid; grid-template-columns:repeat(5,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:1rem; overflow:hidden; margin-top:3rem; }
.nd { background:var(--bg-2); padding:1.4rem 1.2rem; }
.nd .nn { font-family:var(--display); font-weight:900; font-size:1.6rem; color:rgba(243,255,0,.35); line-height:1; }
.nd h4 { font-size:.9rem; font-weight:600; margin:.7rem 0 .35rem; line-height:1.3; }
.nd p { font-size:.78rem; color:var(--ink-3); line-height:1.55; }

/* CLOSING */
#closing { text-align:center; padding-bottom:clamp(5rem,12vw,8rem); background:radial-gradient(900px 500px at 50% 35%, rgba(243,255,0,.1), transparent 60%); }
#closing h2 { max-width:46rem; margin:0 auto; }
#closing p { max-width:36rem; margin:1.2rem auto 2.2rem; color:var(--ink-2); line-height:1.8; }
.cta { display:inline-flex; align-items:center; gap:.6rem; padding:1.05rem 2.2rem; background:var(--y); color:#0a0a0a; text-decoration:none;
  font-family:var(--display); font-weight:900; font-size:.82rem; letter-spacing:.12em; text-transform:uppercase; border-radius:.8rem;
  box-shadow:0 0 30px rgba(243,255,0,.4), 0 12px 30px rgba(0,0,0,.4); transition:transform .1s ease-out; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
.cta.pressed { transform:scale(.97); }

footer { border-top:1px solid var(--line); padding:1.6rem var(--pad); display:flex; justify-content:space-between; align-items:center; gap:1rem; font-size:.75rem; color:var(--ink-3); background:var(--bg); }
footer a { color:var(--y); text-decoration:none; }

/* reveal ao rolar: só transform e opacity */
.rv { opacity:0; transform:translateY(1.4rem); transition:opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1); }
.rv.on { opacity:1; transform:none; }
.bar i, .lane .car { transition:transform 1.1s cubic-bezier(.16,1,.3,1); }
.dash:not(.on) .bar i { transform:scaleX(0); }

/* RESPONSIVO */
@media (max-width:960px) {
  .dor-grid { grid-template-columns:1fr 1fr; }
  .steps { grid-template-columns:1fr 1fr; }
  .step::after { display:none; }
  .telas { grid-template-columns:1fr; }
  .ent-grid, .esc-grid, .prova, .inv { grid-template-columns:1fr; }
  .prova, .inv { gap:2rem; }
  .tl { grid-template-columns:repeat(3,1fr); }
  .tli:nth-child(3) { border-right:none; }
  .tli:nth-child(-n+3) { border-bottom:1px solid var(--line); }
  .need { grid-template-columns:1fr 1fr; }
  .nd:last-child { grid-column:1 / -1; }
}
@media (max-width:620px) {
  .nav-r { display:none; }
  .hero-stats { grid-template-columns:repeat(3,1fr); width:100%; }
  .hs { padding:.85rem .5rem; } .hs .n { font-size:1.5rem; } .hs .u { font-size:.58rem; letter-spacing:.08em; }
  .dor-grid, .steps { grid-template-columns:1fr; }
  .kpis { grid-template-columns:1fr 1fr; }
  .kpi:nth-child(3) { border-left:none; }
  .kpi:nth-child(-n+2) { border-bottom:1px solid var(--line); }
  .dgrid { grid-template-columns:1fr; }
  .dbox + .dbox { border-left:none; border-top:1px solid var(--line); }
  .lane { grid-template-columns:5rem 1fr 3.8rem; gap:.5rem; }
  .esc ul { columns:1; }
  .tl { grid-template-columns:1fr; }
  .tli { border-right:none !important; border-bottom:1px solid var(--line); }
  .tli:last-child { border-bottom:none; }
  .need { grid-template-columns:1fr; }
  .pack { padding:2.4rem 1.4rem 1.6rem; } .pack .badge { left:1.4rem; }
  .pay { grid-template-columns:1fr; }
  footer { flex-direction:column; text-align:center; }
}

/* acessibilidade: três sinais separados */
@media (prefers-reduced-motion:reduce) {
  html { scroll-behavior:auto; }
  .rv { transform:none; transition:opacity .2s ease; }
  .bar i, .lane .car { transition:none; }
  .dash:not(.on) .bar i { transform:none; }
  .cta { transition:none; }
}
@media (prefers-reduced-transparency:reduce) {
  nav { background:#0a0a0a; backdrop-filter:none; -webkit-backdrop-filter:none; }
  .hero-stats { background:#111; backdrop-filter:none; -webkit-backdrop-filter:none; }
}
@media (prefers-contrast:more) {
  :root { --ink-2:#e6e6e6; --ink-3:#bdbdbd; --line:#555; --y-line:rgba(243,255,0,.7); }
  nav { background:#000; border-bottom-color:#555; }
}
</style>
</head>

<style>
#gate { position:fixed; inset:0; z-index:200; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.4rem; padding:2rem 1rem;

  transition:opacity .35s ease; }

.g-dots { display:flex; gap:.9rem; height:1rem; }
.g-dots i { width:.9rem; height:.9rem; border-radius:50%; border:2px solid var(--ink-3); transition:background-color .12s, border-color .12s, transform .12s; }

.g-dots.erro i { border-color:#ff5a5a; background:transparent; box-shadow:none; }
.g-dots.erro { animation:treme .4s cubic-bezier(.36,.07,.19,.97); }
@keyframes treme { 20%,60% { transform:translateX(-.5rem); } 40%,80% { transform:translateX(.5rem); } }
.g-pad { display:grid; grid-template-columns:repeat(3,4.4rem); gap:.8rem; }
.g-pad button { height:4.4rem; border-radius:50%; border:1px solid var(--line); background:rgba(26,26,26,.75); color:var(--ink);
  font:600 1.5rem/1 var(--body); cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); transition:transform .1s ease-out, background-color .1s; }
.g-pad button.pressed { transform:scale(.92); background:rgba(243,255,0,.18); }
.g-pad button.fn { background:transparent; border-color:transparent; font-size:1.1rem; color:var(--ink-3); }
.g-pad button:focus-visible { outline:2px solid var(--y); outline-offset:2px; }
.g-msg { font-size:.8rem; color:var(--ink-3); min-height:1.2em; text-align:center; }
@media (prefers-reduced-motion:reduce) { #gate, .g-dots i, .g-pad button { transition:none; } .g-dots.erro { animation:none; } }
@media (prefers-reduced-transparency:reduce) { .g-pad button { backdrop-filter:none; -webkit-backdrop-filter:none; background:#1a1a1a; } }
@media (prefers-contrast:more) { .g-pad button { border-color:#777; } .g-dots i { border-color:#ccc; } }
</style>

  var KEY = 'desafio-pin';
  var gate = document.getElementById('gate'), dots = gate.querySelectorAll('.g-dots i'), dotsBox = gate.querySelector('.g-dots'), msg = gate.querySelector('.g-msg');
  var pin = '', ocupado = false;
  document.body.classList.add('trancado');
  var u8 = function(b){ return Uint8Array.from(atob(b), function(ch){ return ch.charCodeAt(0); }); };

  function abrir(p){
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(p), 'PBKDF2', false, ['deriveKey'])
      .then(function(base){ return crypto.subtle.deriveKey({ name:'PBKDF2', salt:u8(D.s), iterations:D.n, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['decrypt']); })
      .then(function(k){ return crypto.subtle.decrypt({ name:'AES-GCM', iv:u8(D.i) }, k, u8(D.c)); })
      .then(function(buf){ return new TextDecoder().decode(buf); });
  }
  function mostrar(html, p){
    document.getElementById('miolo').outerHTML = html;
    try { localStorage.setItem(KEY, p); } catch(e) {}
    document.body.classList.remove('trancado');
    gate.classList.add('saindo');
    setTimeout(function(){ gate.remove(); }, 400);
    if (window.iniciar) window.iniciar();
  }
  function pintar(){ dots.forEach(function(d, i){ d.classList.toggle('on', i < pin.length); }); }
  function tentar(){
    ocupado = true; msg.textContent = 'Abrindo…';
    abrir(pin).then(function(html){ mostrar(html, pin); }, function(){
      msg.textContent = 'PIN incorreto. Tente de novo.';
      dotsBox.classList.remove('erro'); void dotsBox.offsetWidth; dotsBox.classList.add('erro');
      if (navigator.vibrate) navigator.vibrate(60);
      pin = ''; pintar(); ocupado = false;
    });
  }
  function tecla(k){
    if (ocupado) return;
    if (k === 'del') { pin = pin.slice(0, -1); }
    else if (/^\d$/.test(k) && pin.length < 4) { pin += k; dotsBox.classList.remove('erro'); msg.textContent = ''; }
    pintar();
    if (pin.length === 4) tentar();
  }
  gate.querySelectorAll('.g-pad button').forEach(function(b){
    var k = b.dataset.k || b.textContent.trim();
    if (!k) return;
    // resposta no toque, não no soltar
    b.addEventListener('pointerdown', function(e){ e.preventDefault(); b.classList.add('pressed'); tecla(k); });
    ['pointerup','pointerleave','pointercancel'].forEach(function(ev){ b.addEventListener(ev, function(){ b.classList.remove('pressed'); }); });
    b.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tecla(k); } });

<script>
window.iniciar = function(){
// reveal ao rolar
(function(){
  var els = document.querySelectorAll('.rv, .dash');
  if (!('IntersectionObserver' in window)) { els.forEach(function(e){ e.classList.add('on'); }); return; }
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){ if (en.isIntersecting) { en.target.classList.add('on'); io.unobserve(en.target); } });
  }, { rootMargin:'0px 0px -8% 0px', threshold:0.08 });
  els.forEach(function(e){ io.observe(e); });
})();
// feedback no toque, não no soltar
(function(){
  var b = document.querySelector('.cta'); if (!b) return;
  b.addEventListener('pointerdown', function(){ b.classList.add('pressed'); });
  ['pointerup','pointerleave','pointercancel'].forEach(function(ev){ b.addEventListener(ev, function(){ b.classList.remove('pressed'); }); });
})();
};
if (!document.getElementById('gate')) window.iniciar();
</script>
