<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Desafio das Concessionárias</title>
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="theme-color" content="#0a0a0a">
<style>
/* Proposta expirada em 10/10/2026: a página não guarda mais conteúdo, nem cifrado.
   Qualquer PIN mostra o aviso de expirada. Fora do _cadeado de propósito. */
@font-face { font-family:'Mont'; src:url('img/Mont-Bold.otf') format('opentype'); font-weight:700 900; font-display:block; }
:root { --bg:#0a0a0a; --ink:#fff; --ink-2:#c9c9c9; --ink-3:#8a8a8a; --line:#2a2a2a; --y:#f3ff00; --y-line:rgba(243,255,0,.3);
  --display:'Mont',system-ui,sans-serif; --body:system-ui,-apple-system,'Segoe UI',sans-serif; color-scheme:dark; }
* { box-sizing:border-box; margin:0; }
html, body { height:100%; }
body { background:var(--bg); color:var(--ink); font:100%/1.5 var(--body); -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  display:grid; place-items:center; padding:clamp(1rem,4vw,2.5rem); overflow:hidden;
  background:linear-gradient(180deg, rgba(0,0,0,.66), rgba(10,10,10,.94)), image-set(url('img/bgfeirao.webp') type('image/webp'), url('img/bgfeirao.jpg') type('image/jpeg')) center/cover no-repeat, var(--bg); }
.capa { width:min(22rem,100%); text-align:center; display:flex; flex-direction:column; align-items:center; }
.logo { position:relative; margin-bottom:1.6rem; }
.logo::before { content:''; position:absolute; inset:-2rem; background:radial-gradient(closest-side, rgba(243,255,0,.22), transparent 70%); filter:blur(10px); }
.logo img { position:relative; width:min(18rem,70vw); height:auto; display:block; filter:drop-shadow(0 10px 30px rgba(0,0,0,.8)); }
h1 { font-family:var(--display); font-weight:900; font-size:1.25rem; letter-spacing:-.01em; text-transform:uppercase; line-height:1.15; }
.sub { margin-top:.4rem; font-size:.9rem; color:var(--ink-2); }
.dots { display:flex; gap:.9rem; justify-content:center; margin:1.6rem 0 1.9rem; }
.dots i { width:.8rem; height:.8rem; border-radius:50%; border:2px solid var(--ink-3); display:block; will-change:transform; }
.dots i.on { background:var(--y); border-color:var(--y); box-shadow:0 0 12px rgba(243,255,0,.6); }
.keys { display:grid; grid-template-columns:repeat(3,4.4rem); gap:.8rem; }
.key { height:4.4rem; border-radius:50%; border:1px solid var(--line); background:rgba(26,26,26,.75); color:var(--ink); font:600 1.5rem/1 var(--body);
  cursor:pointer; touch-action:manipulation; -webkit-user-select:none; user-select:none; will-change:transform;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
.key.ghost { background:none; border-color:transparent; backdrop-filter:none; -webkit-backdrop-filter:none; font-size:.85rem; color:var(--ink-3); }
.key:focus-visible { outline:2px solid var(--y); outline-offset:3px; }
.aviso { display:none; margin-top:.4rem; padding:1.6rem 1.4rem; border:1px solid var(--y-line); border-radius:1.2rem; background:rgba(17,17,17,.8);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); opacity:0; transform:scale(.96); transform-origin:50% 0; }
.aviso .t { font-family:var(--display); font-weight:900; font-size:1.5rem; text-transform:uppercase; letter-spacing:-.02em; line-height:1.05; color:var(--y); text-shadow:0 0 20px rgba(243,255,0,.4); }
.aviso p { margin-top:.7rem; font-size:.9rem; color:var(--ink-2); line-height:1.6; }
.aviso a { display:inline-block; margin-top:1.1rem; color:#0a0a0a; background:var(--y); text-decoration:none; font-family:var(--display); font-weight:900;
  font-size:.75rem; letter-spacing:.1em; text-transform:uppercase; padding:.8rem 1.3rem; border-radius:.7rem; touch-action:manipulation; }
.capa.expirou .dots, .capa.expirou .keys, .capa.expirou .sub { display:none; }
.capa.expirou .aviso { display:block; }
@media (prefers-reduced-transparency:reduce) { .key, .aviso { backdrop-filter:none; -webkit-backdrop-filter:none; background:#1a1a1a; } }
@media (prefers-contrast:more) { :root { --line:#777; --ink-2:#e6e6e6; --ink-3:#bdbdbd; } .dots i { border-color:#ccc; } }
</style>
</head>
<body>
<main class="capa" id="capa">
  <div class="logo"><img src="img/logo.png" alt="Desafio das Concessionárias" width="1100" height="584"></div>
  <h1>Proposta K2ACE</h1>
  <p class="sub">Digite o PIN de 4 dígitos para abrir</p>
  <div class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="keys" id="keys">
    <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
    <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
    <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
    <span></span><button class="key" data-k="0">0</button>
    <button class="key ghost" data-k="del" aria-label="Apagar">apagar</button>
  </div>
  <div class="aviso" id="aviso" role="status" aria-live="polite">
    <div class="t">Proposta expirada</div>
    <p>O prazo desta proposta terminou. Para uma nova condição, fale com a K2ACE.</p>
    <a href="mailto:klaus@k2ace.com">Falar com a K2ACE</a>
  </div>
</main>

<script type="application/json" id="cofre">{"grupo":"desafio","expirada":true}</script>
<script>
(function(){
const REDUZIR = matchMedia('(prefers-reduced-motion: reduce)');
const dots = document.getElementById('dots'), keys = document.getElementById('keys'), capa = document.getElementById('capa'), aviso = document.getElementById('aviso');
let pin = '', feito = false;

/* Mola: parte do valor na tela e pode ser redirecionada no meio. */
const molas = new WeakMap();
function mola(el, alvo, {damping = 1, response = .3, prop = 'scale'} = {}){
  const st0 = molas.get(el);
  if (st0) cancelAnimationFrame(st0.raf);
  let valor = st0 ? st0.valor : (prop === 'opacidade' ? 0 : 1), v = st0 ? st0.v : 0;
  const pinta = (x) => {
    if (prop === 'opacidade'){ el.style.opacity = Math.max(0, Math.min(1, x)); el.style.transform = `scale(${.96 + .04 * x})`; }
    else el.style.transform = `scale(${x})`;
  };
  if (REDUZIR.matches){ pinta(alvo); molas.set(el, {valor: alvo, v: 0, raf: 0}); return; }
  const w = 2 * Math.PI / response, z = damping; let t0 = performance.now();
  const st = {valor, v, raf: 0}; molas.set(el, st);
  const passo = (t) => {
    const dt = Math.min((t - t0) / 1000, 1 / 30); t0 = t;
    v += (-w * w * (valor - alvo) - 2 * z * w * v) * dt; valor += v * dt;
    pinta(valor); st.valor = valor; st.v = v;
    if (Math.abs(valor - alvo) < .0006 && Math.abs(v) < .005){ pinta(alvo); st.valor = alvo; st.v = 0; return; }
    st.raf = requestAnimationFrame(passo);
  };
  st.raf = requestAnimationFrame(passo);
}
/* Resposta no toque, não na soltura. */
keys.addEventListener('pointerdown', (e) => {
  const k = e.target.closest('.key'); if (!k) return;
  k.setPointerCapture?.(e.pointerId);
  mola(k, .9, {response: .22});
  const solta = () => { mola(k, 1, {damping: .8, response: .32}); k.removeEventListener('pointerup', solta); k.removeEventListener('pointercancel', solta); };
  k.addEventListener('pointerup', solta); k.addEventListener('pointercancel', solta);
}, {passive: true});
keys.addEventListener('click', (e) => { const b = e.target.closest('.key'); if (b) tecla(b.dataset.k); });
addEventListener('keydown', (e) => { if (/^[0-9]$/.test(e.key)) tecla(e.key); else if (e.key === 'Backspace') tecla('del'); });

function tecla(k){
  if (feito) return;
  if (k === 'del') pin = pin.slice(0, -1); else if (pin.length < 4) pin += k;
  [...dots.children].forEach((d, i) => d.classList.toggle('on', i < pin.length));
  if (pin.length === 4){ feito = true; setTimeout(expira, 220); }
}
function expira(){
  capa.classList.add('expirou');
  molas.set(aviso, {valor: 0, v: 0, raf: 0});
  mola(aviso, 1, {prop: 'opacidade', response: .35});
}
})();
</script>
<script defer src="https://deck.k2ia.app/track.js"></script>
</body>
</html>
