<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#0d2040"/>
      <stop offset="100%" stop-color="#050912"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4ef" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2dd4ef" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4ef"/>
      <stop offset="100%" stop-color="#4cb9fb"/>
    </linearGradient>
    <filter id="bloom">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- ambient glow -->
  <ellipse cx="32" cy="28" rx="26" ry="22" fill="url(#glow)"/>

  <!-- brain shape — simplified lobe paths -->
  <g fill="none" stroke="url(#brain)" stroke-linecap="round" stroke-linejoin="round" filter="url(#bloom)">
    <!-- left lobe outer -->
    <path d="M22 38 C14 36 11 29 13 23 C15 17 21 14 26 16 C27 11 32 10 35 13" stroke-width="2.2"/>
    <!-- right lobe outer -->
    <path d="M42 38 C50 36 53 29 51 23 C49 17 43 14 38 16 C37 11 32 10 35 13" stroke-width="2.2"/>
    <!-- center divide -->
    <path d="M32 38 L32 13" stroke-width="1.4" stroke-dasharray="2 2" opacity="0.6"/>
    <!-- left lobe detail -->
    <path d="M18 30 C17 26 18 22 21 20" stroke-width="1.5" opacity="0.85"/>
    <path d="M20 35 C15 33 14 27 16 24" stroke-width="1.2" opacity="0.6"/>
    <!-- right lobe detail -->
    <path d="M46 30 C47 26 46 22 43 20" stroke-width="1.5" opacity="0.85"/>
    <path d="M44 35 C49 33 50 27 48 24" stroke-width="1.2" opacity="0.6"/>
    <!-- bottom stem / brainstem -->
    <path d="M26 38 Q32 42 38 38" stroke-width="2" stroke="url(#brain)"/>
    <!-- neural dots -->
  </g>

  <!-- neural spark dots -->
  <circle cx="26" cy="16" r="1.8" fill="#2dd4ef" opacity="0.9"/>
  <circle cx="38" cy="16" r="1.8" fill="#2dd4ef" opacity="0.9"/>
  <circle cx="13" cy="23" r="1.4" fill="#4cb9fb" opacity="0.8"/>
  <circle cx="51" cy="23" r="1.4" fill="#4cb9fb" opacity="0.8"/>
  <circle cx="18" cy="30" r="1.2" fill="#2dd4ef" opacity="0.7"/>
  <circle cx="46" cy="30" r="1.2" fill="#2dd4ef" opacity="0.7"/>

  <!-- K2IA text -->
  <text x="32" y="53" font-family="'Sora','Inter',system-ui,sans-serif" font-weight="800"
        font-size="10.5" fill="#2dd4ef" text-anchor="middle" letter-spacing="1.5"
        filter="url(#bloom)">K2IA</text>
</svg>
