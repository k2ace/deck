<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1A1C19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Conselho">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231A1C19'/%3E%3Ccircle cx='16' cy='17' r='9' fill='none' stroke='%23356647' stroke-width='2.6'/%3E%3Cpath d='M16 11.5V17l3.6 2.4' stroke='%23fff' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Mesa de Conselho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap">
<style>
:root{
  --paper:#E4E5DF; --panel:#F1F2ED; --sunk:#D6D8D0;
  --ink:#1A1C19; --muted:#5B615A; --faint:#8C918A; --hair:#C9CBC3;
  --moss:#356647; --violet:#453C80; --alert:#A8600F;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121412; --panel:#1B1E1B; --sunk:#232722;
  --ink:#E7E9E4; --muted:#979C94; --faint:#6C716A; --hair:#282C27;
  --moss:#7FBF95; --violet:#A79BEB; --alert:#DEA85A;
}}
:root[data-theme="dark"]{
  --paper:#121412; --panel:#1B1E1B; --sunk:#232722;
  --ink:#E7E9E4; --muted:#979C94; --faint:#6C716A; --hair:#282C27;
  --moss:#7FBF95; --violet:#A79BEB; --alert:#DEA85A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:Archivo,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:16.5px; line-height:1.5; font-synthesis:none;
  padding-bottom:calc(4.6rem + env(safe-area-inset-bottom));
}
body[data-adv="n"]{--sig:var(--moss)}
body[data-adv="u"]{--sig:var(--violet)}
.voice{font-family:Newsreader,Georgia,serif;font-style:italic;font-weight:400;letter-spacing:0}
.tag{font-size:.74rem;font-weight:600;letter-spacing:.04em;color:var(--faint)}

.shell{max-width:33rem;margin:0 auto;padding:0 1.2rem}

/* trilho do tempo, à esquerda absoluta */
#rail{position:fixed;left:0;top:0;bottom:0;width:3px;background:transparent;z-index:40;pointer-events:none}
#rail i{display:block;width:100%;height:0;background:var(--sig);transition:height 1s linear}
body.warn #rail i{background:var(--alert)}

/* topo */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--hair)}
.top .shell{display:flex;align-items:stretch;gap:1.4rem;padding-top:.45rem}
.who{background:none;border:0;padding:.5rem 0 .55rem;font:inherit;color:var(--faint);
     cursor:pointer;text-align:left;border-bottom:2px solid transparent;margin-bottom:-1px}
.who .h{display:block;font-size:.72rem;font-weight:500;letter-spacing:.02em}
.who .m{display:block;font-weight:700;font-size:1.02rem;line-height:1.15;letter-spacing:-.01em}
.who[aria-selected=true]{color:var(--ink);border-bottom-color:var(--sig)}
.who:focus-visible{outline:2px solid var(--ink);outline-offset:-3px}

main{padding-top:1.5rem}
.screen{animation:in .17s cubic-bezier(.2,.7,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}#rail i{transition:none}}

h1{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:1.72rem;line-height:1.1;
   letter-spacing:-.01em;margin:0 0 .4rem;text-wrap:balance}
h2{font-family:Newsreader,Georgia,serif;font-weight:400;font-size:1.32rem;line-height:1.26;
   margin:0 0 1rem;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 2rem;font-size:.96rem;max-width:30rem}
.eyebrow{display:block;font-size:.74rem;font-weight:600;letter-spacing:.03em;color:var(--sig);margin-bottom:.5rem}
.sect{margin-top:2.3rem}
.sect > h3{font-size:.8rem;font-weight:600;letter-spacing:.02em;color:var(--faint);
           margin:0 0 .2rem;padding-bottom:.55rem;border-bottom:1px solid var(--hair)}

/* linhas */
.row{display:flex;gap:.9rem;align-items:flex-start;width:100%;text-align:left;background:none;
     border:0;border-bottom:1px solid var(--hair);padding:1rem 0;font:inherit;color:var(--ink);cursor:pointer}
.row:active{background:var(--sunk)}
.row:focus-visible{outline:2px solid var(--sig);outline-offset:-2px}
.row .b{flex:1;min-width:0}
.row .b .k{display:block;font-size:.74rem;font-weight:600;color:var(--sig);margin-bottom:.28rem;letter-spacing:.02em}
.row .b .s{display:block;color:var(--faint);font-size:.82rem;margin-top:.28rem}
.row .go{flex:none;color:var(--hair);align-self:center;font-size:1.3rem;line-height:1}
.row:active .go{color:var(--sig)}

/* batidas do tempo */
.beat{display:flex;gap:.95rem;padding:.85rem 0;border-bottom:1px solid var(--hair);position:relative}
.beat .t{flex:none;width:3.1rem;font-size:.78rem;font-weight:600;color:var(--faint);
         font-variant-numeric:tabular-nums;padding-top:.16rem}
.beat b{display:block;font-weight:600;margin-bottom:.12rem}
.beat p{margin:0;color:var(--muted);font-size:.93rem}
.beat.now{background:var(--panel);box-shadow:-1.2rem 0 0 var(--panel),1.2rem 0 0 var(--panel)}
.beat.now .t{color:var(--sig)}

/* fala */
.speak{border-left:2px solid var(--sig);padding-left:1.05rem;margin:.9rem 0 1.5rem}
.speak p{margin:0;font-size:1.16rem;line-height:1.45}
.why{color:var(--muted);font-size:.95rem;margin:0 0 1.6rem;max-width:30rem}
.react{margin-top:1.7rem;border-top:1px solid var(--hair);padding-top:1.1rem}
.react h3{font-size:.8rem;font-weight:600;color:var(--faint);margin:0 0 .8rem;letter-spacing:.02em}
.react dl{margin:0}
.react dt{font-size:1rem;margin-top:1.1rem}
.react dd{margin:.35rem 0 0;padding-left:1rem;border-left:1px solid var(--hair);color:var(--muted);font-size:.98rem}

/* destino */
.dest{display:block;width:100%;text-align:left;background:var(--panel);border:0;border-left:3px solid var(--sig);
      padding:1rem 1.1rem;font:inherit;color:var(--ink);cursor:pointer}
.dest:active{background:var(--sunk)}
.dest .k{display:block;font-size:.74rem;font-weight:600;color:var(--sig);letter-spacing:.03em;margin-bottom:.3rem}
.dest strong{display:block;font-family:Newsreader,Georgia,serif;font-weight:500;font-size:1.2rem;letter-spacing:-.005em}
.dest .p{display:block;color:var(--muted);font-size:.88rem;margin-top:.25rem}
ol.steps{margin:1.1rem 0 0;padding-left:1.3rem;display:flex;flex-direction:column;gap:.65rem}
ol.steps::marker{color:var(--sig);font-weight:600}
.crit{margin-top:1.7rem;border-top:1px solid var(--hair);padding-top:1.1rem}
.crit h3{font-size:.8rem;font-weight:600;color:var(--faint);margin:0 0 .35rem}
.crit p{margin:0}
.ask{margin-top:2.2rem;border-top:2px solid var(--sig);padding-top:1.1rem}
.ask h3{font-size:.8rem;font-weight:600;color:var(--sig);margin:0 0 .6rem}
.ask p{margin:0;font-size:1.1rem;line-height:1.45}

/* referência */
.brief h3{font-size:.78rem;font-weight:700;letter-spacing:.03em;color:var(--sig);margin:1.7rem 0 .45rem}
.brief h3:first-child{margin-top:0}
.brief p{margin:0}
.brief ul{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:.45rem}
.seat{padding:1.3rem 0;border-bottom:1px solid var(--hair)}
.seat h3{margin:0 0 .65rem;font-size:.95rem;color:var(--sig);font-weight:700}
.seat ol{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:.65rem;font-size:.95rem;color:var(--muted)}
.seat p.none{margin:0;color:var(--faint);font-size:.92rem}
.seat.mine ol{color:var(--ink)}


/* HERO: o cronometro é a peça principal */
.hero{background:var(--ink);color:var(--paper);margin:0 -1.2rem;padding:1.5rem 1.2rem 1.4rem;
      display:block;width:calc(100%% + 2.4rem);text-align:left;border:0;font:inherit;cursor:pointer}
.hero:active{opacity:.9}
.hero .top-line{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.hero .name{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:1.5rem;letter-spacing:-.01em;line-height:1.1}
.hero .state{font-size:.74rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.6}
.hero .face{font-size:3.6rem;font-weight:700;letter-spacing:-.045em;line-height:1;
            font-variant-numeric:tabular-nums;margin-top:.7rem;display:block}
.hero .beatnow{font-size:.95rem;font-weight:600;opacity:.85;margin-top:.35rem;display:block}
.hero.on .face{color:var(--sig)}
.hero.warn .face{color:var(--alert)}
.hero .sub{font-size:.9rem;opacity:.62;margin-top:.9rem;display:block;max-width:26rem;line-height:1.4}

/* cartoes de pergunta */
.qcard{display:block;width:100%%;text-align:left;background:var(--panel);border:0;
       border-top:3px solid var(--sig);padding:1.1rem 1.15rem 1.2rem;margin:0 0 .7rem;
       font:inherit;color:var(--ink);cursor:pointer}
.qcard:active{background:var(--sunk)}
.qcard:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
.qcard .lbl{display:flex;justify-content:space-between;align-items:center;
            font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
            color:var(--sig);margin-bottom:.55rem}
.qcard .lbl span:last-child{color:var(--hair);font-size:1.2rem;letter-spacing:0}
.qcard p{margin:0;font-family:Newsreader,Georgia,serif;font-size:1.14rem;line-height:1.34}

/* faixa de destinos */
.chips{display:flex;gap:.5rem;overflow-x:auto;padding:.15rem .15rem .5rem;margin:0 -1.2rem;
       padding-left:1.2rem;padding-right:1.2rem;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:none;border:1px solid var(--hair);border-left:3px solid var(--sig);
      padding:.6rem .8rem;font:inherit;color:var(--ink);cursor:pointer;text-align:left;max-width:12rem}
.chip:active{background:var(--sunk)}
.chip b{display:block;font-weight:600;font-size:.92rem;line-height:1.25}
.chip span{display:block;color:var(--faint);font-size:.76rem;margin-top:.18rem}
.chip.key{border-color:var(--sig);background:var(--sig);color:var(--paper)}
.chip.key span{color:var(--paper);opacity:.75}

/* rodape de consulta */
.look{display:flex;gap:1.4rem;padding:.2rem 0 0;flex-wrap:wrap}
.look button{background:none;border:0;padding:.5rem 0;font:inherit;font-size:.92rem;font-weight:600;
             color:var(--muted);cursor:pointer;border-bottom:1px solid var(--hair)}
.look button:active{color:var(--ink)}

/* barra inferior */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);
        border-top:1px solid var(--hair);padding-bottom:env(safe-area-inset-bottom)}
.bottom .shell{display:flex;align-items:center;gap:.9rem;height:3.9rem}
.bottom button{background:none;border:0;font:inherit;color:var(--ink);cursor:pointer;font-weight:600;
               font-size:.95rem;padding:.55rem 0}
.bottom button[disabled]{color:var(--hair);cursor:default}
.bottom .crumb{flex:1;min-width:0;color:var(--faint);font-size:.78rem;text-align:center;
               overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.02rem;letter-spacing:-.01em;
       border:1px solid var(--hair);padding:.34rem .6rem;color:var(--muted);min-width:4.6rem;text-align:center}
#clock.on{color:var(--sig);border-color:var(--sig)}
#clock.warn{color:var(--alert);border-color:var(--alert)}
.bottom button:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
</style>
</head>
<body>

<div id="rail"><i></i></div>

<header class="top">
  <div class="shell" role="tablist" aria-label="Aconselhado">
    <button class="who" role="tab" data-go="n" aria-selected="true"><span class="h">9h · arquitetura</span><span class="m">Naindry</span></button>
    <button class="who" role="tab" data-go="u" aria-selected="false"><span class="h">10h30 · farma</span><span class="m">Leandro</span></button>
  </div>
</header>

<main class="shell" id="view"></main>

<nav class="bottom">
  <div class="shell">
    <button id="back" disabled>&larr; Voltar</button>
    <span class="crumb" id="crumb">Início</span>
    <button id="clock" title="Toque para começar seus 10 minutos. Segure para zerar.">10:00</button>
  </div>
</nav>

<script>
const DATA = {
n: {
  nome: "Naindry", hora: "9h", cor: "moss",
  sub: "Arquitetura de natureza. Quer virar ecossistema sem recriar a dependência dela.",
  plano: [
    ["0–1", "Enquadra", "“Vou ficar num ponto só, que é da minha cadeira: o estado dos seus ativos de marca e de dado. Tudo que os outros propuseram aqui depende disso funcionar.”"],
    ["1–4", "Devolve pelo número da 2", "Ela já é a plataforma que quer construir. Só que roda no celular dela, sem registro e de graça."],
    ["4–8", "Aponta o destino", "Um ou dois destinos, nunca os quatro. O que a resposta dela pedir."],
    ["8–10", "Pede uma coisa só", "O pedido de 30 dias. Se o tempo apertar, corta o resto e mantém isso."]
  ],
  pedido: "“Registrar todo pedido de indicação num lugar só, por 30 dias. Não muda nada na sua rotina, e em três meses você chega com o número que responde a pergunta principal que trouxe hoje. Sem esse dado, qualquer modelo que a gente desenhar aqui é palpite.”",
  destinos: {
    d1: { nome: "Tirar a rede do celular", prazo: "30 dias",
      passos: ["Uma base única da empresa, num CRM simples. A ferramenta é a parte fácil e a última.",
               "Importar contatos de WhatsApp, e-mail e Instagram.",
               "Classificar em seis grupos: marca, fabricante, fornecedor, profissional, investidor, cliente.",
               "Um responsável que não é ela, com quatro horas por semana."],
      criterio: "Se ela sumir 60 dias, alguém consegue ativar a rede." },
    d2: { nome: "Registrar toda indicação", prazo: "90 dias, custo zero",
      passos: ["Seis campos numa planilha: data, quem pediu, o que precisava, quem foi indicado, fechou ou não, quanto.",
               "Nada de sistema. Planilha e disciplina.",
               "Revisar o acumulado uma vez por mês."],
      criterio: "Em 90 dias ela sabe quanto vale a indicação dela — que é a resposta da pergunta do Adilson, com número em vez de intuição." },
    d3: { nome: "Cobrar de cinco parceiros", prazo: "90 dias",
      passos: ["Cinco parceiros com quem ela já tem intimidade. Cinco conversas, não cinquenta.",
               "Testar uma contrapartida real: selo, listagem, indicação qualificada, acesso à base.",
               "Condição de fundador para os cinco primeiros e ajuste pela reação.",
               "Versão manual da plataforma: uma página com o critério, um formulário, conexão feita na mão."],
      criterio: "Se em 90 dias houver gente pagando, aí sim vale construir software — e ela vai construir sabendo o que ele precisa fazer." },
    d4: { nome: "Catalogar o acervo e ir por formação", prazo: "rota alternativa",
      passos: ["Vale quando o volume de conexões for baixo demais para sustentar plataforma.",
               "Catalogar antes de produzir: acervo, critérios de projeto, método.",
               "Formação e produto se apoiam nesse acervo, não em ela gravar tudo do zero."],
      criterio: "O ativo aqui deixa de ser a rede e passa a ser a autoridade e o conhecimento." }
  },
  perguntas: [
    { tag: "o ativo",
      texto: "Se um concorrente comprasse sua empresa amanhã e você não fosse junto no pacote, o que ele estaria comprando exatamente?",
      respostas: [
        { r: "“Levaria a equipe e os projetos. Os contatos estão comigo, no WhatsApp e no Instagram.”",
          nota: "o mais provável",
          diz: "“Então hoje o maior ativo da empresa não é da empresa, é seu. E isso limita tudo o que a gente discutiu aqui: não dá para delegar, não dá para trazer sócio, não dá para vender, e não dá para construir ecossistema em cima de uma agenda de celular.”",
          porque: "Ela abriu o material dizendo que a rede vale mais que o escritório. Acabou de admitir que essa rede não pertence à empresa. É a contradição que sustenta os seus dez minutos.",
          dest: "d1",
          reacoes: [["“Mas eu conheço todo mundo, isso não se transfere.”", "“Conhecimento que mora numa cabeça não vira patrimônio nem sucessão. O que a gente quer registrar não é a relação, é o mapa dela.”"],
                    ["“Não tenho tempo pra isso.”", "“E não é pra ser você. É alguém do time, quatro horas por semana. Se depender de você, já nasce com o problema que a gente está tentando resolver.”"]] },
        { r: "“Tenho uma planilha, mas está desatualizada.”",
          diz: "“Então o problema já não é criar, é manter. E manter é sempre problema de dono, não de ferramenta. Quem é o dono dessa planilha hoje?”",
          porque: "Se a resposta for ninguém, o próximo passo é nomear alguém e definir a rotina, não escolher sistema. Você economiza dinheiro dela na frente da mesa.",
          dest: "d1",
          reacoes: [["“Ninguém, é todo mundo um pouco.”", "“Todo mundo é ninguém. Um nome, quatro horas por semana, e a base para de morrer.”"]] },
        { r: "“Tenho 40 mil seguidores, minha audiência é grande.”",
          diz: "“Audiência em rede social é terreno alugado. Se a conta cair amanhã, some, e você não tem como avisar ninguém. Quantos desses viraram contato que você aciona direto, sem depender de algoritmo?”",
          porque: "Separa alcance de ativo. Alcance é emprestado; base é patrimônio. O ecossistema precisa da segunda coisa.",
          dest: "d1",
          reacoes: [["“Mas o Instagram funciona muito bem pra mim.”", "“Funciona pra atrair. Não funciona pra convocar. Ecossistema depende de convocar, e isso pede base própria.”"]] },
        { r: "“Já uso um CRM.”",
          diz: "“Ótimo, então a gente pula o diagnóstico. Qual foi a última vez que essa base foi acionada de propósito, qual foi a taxa de resposta, e quem opera isso no dia a dia?”",
          porque: "CRM sem uso é planilha cara. Se ninguém aciona, o assunto vira rotina de ativação, uma comunicação por mês para cada grupo, com responsável e meta.",
          dest: "d1",
          reacoes: [["“A gente usa só pros clientes de projeto.”", "“Então metade do ecossistema está fora da base: fabricante, fornecedor, investidor e aluno. São eles que vão pagar a conta depois.”"]] },
        { r: "“Minha equipe conhece todo mundo, não depende só de mim.”",
          diz: "“Isso é bom e é frágil ao mesmo tempo. Conhecimento que mora nas pessoas sai pela porta junto com elas. Se três pessoas do time saíssem hoje, o que ficaria registrado?”",
          porque: "Mesmo destino, outro argumento: risco de perda em vez de dependência da fundadora. Funciona melhor com quem se incomoda de ouvir que tudo depende dela.",
          dest: "d1", reacoes: [] },
        { r: "Ela trava, não sabe responder.",
          diz: "“Vou facilitar. Pensa só nos fornecedores e fabricantes com quem você já trabalhou. Chuta: são 50, 200, 500? E onde essa lista está hoje?”",
          porque: "Quebrar a pergunta grande em uma categoria só destrava quase sempre. Depois de um número, os outros vêm sozinhos.",
          dest: "d1", reacoes: [] }
      ] },
    { tag: "a demanda",
      texto: "Você fala que a rede e a autoridade valem mais que o próprio escritório. Nos últimos 12 meses, quanto de negócio isso gerou pros outros, indicando e conectando de graça? E quanto gerou pra você?",
      respostas: [
        { r: "“Muito. Deve dar umas 15 por mês. Nunca cobrei e nem sei se fecharam.”",
          nota: "o mais provável",
          diz: "“São cerca de 180 conexões por ano passando pela sua mão. Você já é a plataforma de conexão que quer construir. Ela só não tem registro, não tem contrapartida e não tem receita. O problema é que a plataforma é você, funciona no seu celular e trabalha de graça.”",
          porque: "É o momento mais forte da sua participação inteira. Não é opinião: é a conta dela, dita em voz alta. Deixe o silêncio depois do número.",
          dest: "d2",
          reacoes: [["“Nunca tinha pensado assim.”", "“Então o próximo passo é o mais barato que existe: registrar. Sem inventar nada, só anotar o que já acontece.”"],
                    ["“Mas isso é relacionamento, não é negócio.”", "“Relacionamento é o insumo. Negócio é o que acontece com ele. Hoje o negócio acontece, só que na conta dos outros.”"]] },
        { r: "“Não sei quantas, nunca contei.”",
          diz: "“Vamos estimar juntos agora. Numa semana comum, quantas pessoas te pedem indicação? Três? Então são mais de 150 por ano. Se metade fecha, e o ticket de uma obra é o que você falou, quanto de negócio passou pela sua mão?”",
          porque: "Faça a conta na mesa, com ela. O número calculado por ela vale mais que qualquer argumento seu.",
          dest: "d2", reacoes: [] },
        { r: "“Acho que cobrar por indicação pega mal.”",

var REF = {"n": {"brief": "<div class=\"brief\">\n<h3>Quem é</h3>\n<p>Arquiteta especializada em projetos integrados à natureza, cabanas e empreendimentos de hospitalidade. O escritório ganhou escala na pandemia e passou a atender Brasil e exterior. O crescimento foi mais rápido que a estrutura administrativa, financeira e operacional, gerando operação muito dependente da fundadora.</p>\n<h3>O ativo real</h3>\n<p>Maior que o próprio escritório: rede de relacionamentos, conhecimento de mercado, conexão com marcas, fabricantes, fornecedores, investidores e profissionais, e autoridade consolidada no segmento.</p>\n<h3>Principais desafios</h3>\n<ul>\n<li><b>Desordem operacional:</b> crescimento sem estrutura proporcional, dependência da fundadora.</li>\n<li><b>Sobrecarga e dispersão:</b> arquitetura, construção, produtos, parcerias, conteúdo, educação e novas oportunidades ao mesmo tempo.</li>\n<li><b>Falta de clareza do modelo central:</b> muitas frentes com potencial, sem definição de quais são o ecossistema principal.</li>\n<li><b>Dependência da fundadora:</b> oportunidades, decisões, criação, relacionamento e posicionamento passam por ela.</li>\n<li><b>Dificuldade de selecionar oportunidades:</b> interessantes isoladamente, mas nem todas constroem o longo prazo.</li>\n</ul>\n<h3>Sonho grande</h3>\n<p>Ecossistema de referência em arquitetura de natureza, hospitalidade e construção industrializada, conectando marcas, profissionais, fabricantes, fornecedores, investidores, conhecimento e negócios. Uma plataforma de conexão com rede homologada, podendo ter educação, metodologia própria, mentorias, capacitação, parcerias e produtos. O escritório vira atelier autoral, exclusivo e seletivo, fonte de autoridade e posicionamento, sem crescer em volume.</p>\n<h3>Pergunta principal ao conselho</h3>\n<p>Como transformar esse ecossistema em modelo sólido, rentável e escalável, aproveitando autoridade, rede e oportunidades já existentes, sem criar de novo uma operação complexa e dependente dela?</p>\n<h3>Pontos que ela quer discutir</h3>\n<ul>\n<li>Qual o modelo central de geração de receita.</li>\n<li>Como transformar a rede em ativo real de negócio.</li>\n<li>Quais frentes priorizar primeiro.</li>\n<li>Como estruturar sem criar muitas operações paralelas.</li>\n<li>Qual o papel do escritório na nova estrutura.</li>\n<li>Como criar receita recorrente sem perder o posicionamento premium.</li>\n<li>Como transformar autoridade pessoal em marca e plataforma que cresçam além dela.</li>\n</ul>\n</div>", "seats": "<div class=\"seat\"><h3>Finanças · Adilson</h3><ol><li>Motor de crescimento: se daqui a três anos esse ecossistema estiver funcionando muito bem, de onde virão 70% do lucro e da geração de caixa: projetos de arquitetura, educação, produtos, construção, parcerias e comissões, rede de fornecedores ou outro modelo?</li><li>Recursos: entre todas as oportunidades que estão surgindo, se você tivesse apenas R$ 100 mil e 100 horas suas, onde colocaria para gerar o maior valor econômico nos próximos três anos, e o que deixaria de fazer?</li><li>Monetização dos ativos: qual ativo que você já possui hoje (marca, metodologia, audiência, fornecedores, fabricantes, profissionais, conhecimento, geração de negócios) continuaria produzindo receita mesmo se você reduzisse sua participação operacional em 50%?</li></ol></div><div class=\"seat\"><h3>Processos · Suelen</h3><ol><li>Estrutura atual: quais frentes do negócio já funcionam de forma estruturada e quais ainda dependem de você para acontecer?</li><li>Capacidade de virar operação: quais novas frentes você já tentou colocar em prática nos últimos anos e o que aconteceu com elas depois da ideia inicial?</li><li>Gargalos: qual é a principal área que você gostaria que deixasse de depender de você?</li><li>Metodologia própria: o seu jeito de trabalhar e decidir está documentado em alguma metodologia que possa ser ensinada e replicada pela equipe?</li></ol></div><div class=\"seat\"><h3>Jurídico · Priscila</h3><ol><li>Responsabilidade da rede: ao homologar um fabricante ou fornecedor e ele falhar com o cliente final, quem o cliente vai procurar, o fornecedor ou a sua marca? E até onde você está disposta a responder por isso?</li><li>Seleção de parceiros: a escolha passa por algum critério ou é experiência e confiança? Você analisa os sócios e as estruturas ligadas a esses fornecedores (processos criminais, trabalhistas, consumidor, outras sociedades)?</li><li>Receita recorrente: a ideia é um produto ou serviço remunerado mensalmente? Se sim, o que você conseguiria entregar de forma contínua que continuaria acontecendo num mês em que você estivesse totalmente fora? Se não, o que você entende por recorrência e escala?</li><li>Conexão com investidores: você imagina apresentar oportunidades e ser remunerada pela conexão, ou apenas aproximar as pessoas e sair da relação?</li></ol></div><div class=\"seat\"><h3>Vendas · Ricardo</h3><p class=\"none\">Não enviou perguntas.</p></div><div class=\"seat mine\"><h3>Marketing e Tecnologia · você</h3><ol><li>Se um concorrente comprasse sua empresa amanhã e você não fosse junto no pacote, o que ele estaria comprando exatamente?</li><li>Você fala que a rede e a autoridade valem mais que o próprio escritório. Nos últimos 12 meses, quanto de negócio isso gerou pros outros, indicando e conectando de graça? E quanto gerou pra você?</li><li>Nessa plataforma de conexão que você quer construir, tem alguma parte que já poderia rodar amanhã sem software nenhum, só com processo e uma pessoa cuidando?</li></ol></div>"}, "u": {"brief": "<div class=\"brief\">\n<h3>Quem é</h3>\n<p>Fundada em 2014 em Belo Horizonte. Depois de atuar no setor acadêmico e enfrentar crises, pivotou para a indústria farmacêutica e superou dificuldades financeiras em 2020 trabalhando no fuso europeu. Em 2023 abriu a United America nos EUA para importar direto e eliminar intermediários.</p>\n<h3>Estado atual</h3>\n<p>Cerca de R$ 1 milhão por mês, 12 colaboradores. Atua em farma e expande para nutracêuticos e enxofre, buscando importação direta para eliminar intermediários, ganhar competitividade frente à concorrência tributária e melhorar margem, mantendo a operação enxuta.</p>\n<h3>Sonho grande</h3>\n<p>R$ 10 milhões de faturamento por mês no próximo ano, através da penetração nos mercados de nutracêuticos e enxofre.</p>\n<h3>Principais desafios</h3>\n<ul>\n<li><b>Equipe comercial:</b> evoluir o time de “tiradores de pedido” para consultores ativos e engajados.</li>\n<li><b>Precificação e margem:</b> reduzir a dependência de intermediários financeiros e logísticos.</li>\n<li><b>Tributação:</b> entender a complexidade fiscal, sobretudo na transição para suplementos.</li>\n<li><b>Previsibilidade:</b> validar viabilidade operacional e financeira nos novos mercados, sem histórico de importação direta.</li>\n</ul>\n</div>", "seats": "<div class=\"seat\"><h3>Finanças · Adilson</h3><ol><li>Para sair de R$ 1 milhão para R$ 10 milhões por mês, quanto capital de giro adicional a empresa precisará colocar na operação antes de receber dos clientes, considerando compra, importação, estoque em trânsito, desembaraço, tributos, estoque local e prazo de recebimento?</li><li>Dos R$ 9 milhões mensais de receita adicional, quanto virá de cada linha ou família de produto, e qual margem de contribuição, ciclo de caixa e capital empregado cada frente deverá gerar?</li></ol></div><div class=\"seat\"><h3>Processos · Suelen</h3><ol><li>Equipe comercial: como está estruturado hoje o processo comercial? Quais etapas estão padronizadas e quais dependem da atuação de cada vendedor?</li><li>Equipe comercial: como um vendedor identifica uma oportunidade além da demanda inicial do cliente? Existe processo definido para investigar necessidades, apresentar soluções e desenvolver novas oportunidades?</li><li>Intermediários: em quais etapas de compra, importação e comercialização vocês dependem de intermediários, e qual função cada um desempenha?</li><li>Intermediários: dessas etapas, quais a empresa já teria condições de assumir internamente e quais exigiriam mudanças na operação?</li></ol></div><div class=\"seat\"><h3>Jurídico · Priscila</h3><p class=\"none\">Não enviou perguntas.</p></div><div class=\"seat\"><h3>Vendas · Ricardo</h3><p class=\"none\">Não enviou perguntas.</p></div><div class=\"seat mine\"><h3>Marketing e Tecnologia · você</h3><ol><li>Se os seus dois melhores vendedores saíssem amanhã, o que a United ainda saberia sobre os clientes deles?</li><li>Vocês faturam 1 milhão por mês e querem chegar a 10. Isso só pode vir de três lugares: mais clientes, os mesmos clientes comprando mais vezes, ou ticket maior. Qual o peso de cada um nesse plano? E se boa parte for cliente novo, por onde eles vão ficar sabendo que a United existe?</li><li>A importação direta melhora a margem, isso tá claro. Agora, se semana que vem um concorrente igualar seu preço no nutracêutico, por que o cliente continua comprando de vocês?</li></ol></div>"}};

var adv='n', stack=[], view=document.getElementById('view'),
    back=document.getElementById('back'), crumb=document.getElementById('crumb'),
    clockEl=document.getElementById('clock'), rail=document.querySelector('#rail i');

var TOTAL=600, t0=null, paused=0, tick=null;

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function d(){return DATA[adv]}
function elapsed(){ return t0===null ? paused : paused + (Date.now()-t0)/1000; }

function beatIndex(){
  var e=elapsed(); if(t0===null && paused===0) return -1;
  if(e<60) return 0; if(e<240) return 1; if(e<480) return 2; return 3;
}
function paintClock(){
  var e=Math.min(elapsed(),TOTAL*2), left=Math.max(0,TOTAL-e);
  var m=Math.floor(left/60), s=Math.floor(left%60);
  var txt=(left<=0?'-':'')+m+':'+(s<10?'0':'')+s;
  clockEl.textContent=txt;
  [].forEach.call(document.querySelectorAll('.clockface'),function(el){el.textContent=txt});
  var hero=document.getElementById('hero');
  if(hero){
    hero.classList.toggle('on', t0!==null && e<540);
    hero.classList.toggle('warn', e>=540);
    var st=document.getElementById('hstate'), hb=document.getElementById('hbeat');
    if(st) st.textContent = t0!==null ? 'correndo' : (paused>0 ? 'pausado' : 'toque para começar');
    var bi=beatIndex();
    if(hb) hb.textContent = bi<0 ? 'seus 10 minutos começam aqui' : d().plano[bi][1]+' · '+d().plano[bi][0]+' min';
  }
  clockEl.classList.toggle('on', t0!==null && e<540);
  clockEl.classList.toggle('warn', e>=540);
  document.body.classList.toggle('warn', e>=540);
  rail.style.height=Math.min(100,(e/TOTAL)*100)+'%';
  var b=beatIndex();
  [].forEach.call(document.querySelectorAll('.beat'),function(el,i){el.classList.toggle('now',i===b)});
}
function startPause(){
  if(t0===null){ t0=Date.now(); tick=setInterval(paintClock,1000); }
  else { paused+=(Date.now()-t0)/1000; t0=null; clearInterval(tick); }
  paintClock();
}
function resetClock(){ t0=null; paused=0; clearInterval(tick); paintClock(); }
var held=null;
clockEl.addEventListener('pointerdown',function(){ held=setTimeout(function(){held='done';resetClock()},600) });
clockEl.addEventListener('pointerup',function(){ if(held==='done'){held=null;return} clearTimeout(held); held=null; startPause(); });
clockEl.addEventListener('pointerleave',function(){ clearTimeout(held); });

function render(){
  var s=stack.length?stack[stack.length-1]:{t:'home'};
  document.body.dataset.adv=adv;
  view.innerHTML='<div class="screen">'+SCREEN[s.t](s)+'</div>';
  back.disabled=stack.length===0;
  crumb.textContent=s.crumb||'Início';
  window.scrollTo({top:0,behavior:'instant'});
  var hb=document.getElementById('hero');
  if(hb) hb.addEventListener('click', startPause);
  [].forEach.call(view.querySelectorAll('[data-nav]'),function(el){
    el.addEventListener('click',function(){ push(JSON.parse(el.dataset.nav)) });
  });
  paintClock();
}
function push(s){stack.push(s);render()}
function pop(){stack.pop();render()}
function home(){stack=[];render()}

function row(kicker,label,sub,nav){
  return '<button class="row" data-nav=\''+JSON.stringify(nav)+'\'><span class="b">'+
    (kicker?'<span class="k">'+esc(kicker)+'</span>':'')+label+
    (sub?'<span class="s">'+esc(sub)+'</span>':'')+'</span><span class="go">&rsaquo;</span></button>';
}

};

[].forEach.call(document.querySelectorAll('.who'),function(b){
  b.addEventListener('click',function(){
    adv=b.dataset.go;
    [].forEach.call(document.querySelectorAll('.who'),function(t){
      t.setAttribute('aria-selected',String(t.dataset.go===adv));
    });
    try{localStorage.setItem('clubm',adv)}catch(e){}
    resetClock(); home();
  });
});
back.addEventListener('click',pop);
try{ if(localStorage.getItem('clubm')==='u'){document.querySelector('.who[data-go=u]').click()} }catch(e){}
render();
